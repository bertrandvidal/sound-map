name: CI

# `push` is scoped to main so a PR branch does not trigger two runs of the same
# commit: an unfiltered `push` fires on the branch ref while `pull_request`
# fires on the merge ref, and the concurrency group below cannot dedupe them
# because the two refs differ.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR commits are worth cancelling; superseded main commits are not.
# Every commit on main is deployed to production, so each one keeps its own
# completed CI record rather than being cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default. Only the coverage-comment job below re-requests
# the pull-requests: write scope it needs — the build/test job runs installed
# dependencies and test code, which must never hold a write-capable token.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npx biome check .

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  coverage-comment:
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: Post coverage comment
        # Third-party action pinned to a commit SHA so a repointed tag cannot
        # inject code that runs with the PR-write token.
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
