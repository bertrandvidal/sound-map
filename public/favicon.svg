<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="sound-map">
  <title>sound-map</title>
  <!-- Spotify's visual language — solid green disc, three white arcs — with the
       arcs reinterpreted as a globe's parallels, plus a meridian and limb. -->
  <circle cx="32" cy="32" r="32" fill="#1DB954"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
    <circle cx="32" cy="32" r="19.5"/>
    <ellipse cx="32" cy="32" rx="8.5" ry="19.5"/>
    <path d="M14.5 25.5 Q32 31 49.5 25.5"/>
    <path d="M12.5 32 H51.5"/>
    <path d="M14.5 38.5 Q32 44 49.5 38.5"/>
  </g>
</svg>
